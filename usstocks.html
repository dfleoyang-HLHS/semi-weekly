<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<style>
.us-hero {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
}
.us-hero h2 { color: var(--accent); margin-bottom: 8px; font-size: 20px; }
.us-hero p { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin: 0; }

.us-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.us-filter-btn {
  padding: 6px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.us-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.us-filter-btn.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

.us-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.us-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.us-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.us-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.us-name { font-size: 18px; font-weight: 700; color: var(--text); }
.us-ticker { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.us-badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.badge-a { background: rgba(29, 158, 117, 0.15); color: #10b981; }
.badge-b { background: rgba(24, 95, 165, 0.15); color: #3b82f6; }
.badge-c { background: rgba(186, 117, 23, 0.15); color: #f59e0b; }
.badge-d { background: rgba(163, 45, 45, 0.15); color: #ef4444; }

.us-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.us-metric {
  background: var(--bg-elevated);
  padding: 8px 10px;
  border-radius: 6px;
}
.us-metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.us-metric-value { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
.us-metric-value.up { color: #10b981; }
.us-metric-value.down { color: #ef4444; }

.us-news {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
  padding-top: 8px;
}
.us-news-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.us-news li { margin-bottom: 4px; }

.us-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 10px;
}
.us-tag {
  font-size: 10px;
  padding: 2px 8px;
  background: var(--bg-elevated);
  color: var(--text-dim);
  border-radius: 10px;
}

.us-updated {
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  margin-top: 8px;
  font-style: italic;
}
</style>

<footer>

function renderStocks(filter) {
  const grid = document.getElementById('us-grid');
  const filtered = STOCKS.filter(s => {
    if (filter === 'all') return true;
    if (['a','b','c','d'].includes(filter)) return s.level === filter;
    return s.category === filter;
  });

  grid.innerHTML = filtered.map(s => `
    <div class="us-card">
      <div class="us-card-header">
        <div>
          <div class="us-name">${s.name}</div>
          <div class="us-ticker">${s.ticker}</div>
        </div>
        <span class="us-badge badge-${s.level}">${s.level.toUpperCase()} 級</span>
      </div>
      <div class="us-metrics">
        ${Object.entries(s.metrics).map(([k, v]) => `
          <div class="us-metric">
            <div class="us-metric-label">${k}</div>
            <div class="us-metric-value ${v.includes('+') ? 'up' : v.includes('-') ? 'down' : ''}">${v}</div>
          </div>
        `).join('')}
      </div>
      <div class="us-news">
        <div class="us-news-title">📰 近期重點</div>
        <ul style="margin: 0; padding-left: 18px;">
          ${s.news.map(n => `<li>${n}</li>`).join('')}
        </ul>
        <div class="us-tags">
          ${s.tags.map(t => `<span class="us-tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="us-updated">更新於 2026-08-15</div>
    </div>
  `).join('');

  document.querySelectorAll('.us-filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
}

document.querySelectorAll('.us-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => renderStocks(btn.dataset.filter));
});

renderStocks('all');
