<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股 AI 供應鏈追蹤 - 半導體週報</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<style>
.us-hero {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
}
.us-hero h2 { color: var(--accent); margin-bottom: 8px; font-size: 20px; }
.us-hero p { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin: 0; }

.us-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.us-filter-btn {
  padding: 6px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.us-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.us-filter-btn.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

.us-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.us-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.us-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.us-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.us-name { font-size: 18px; font-weight: 700; color: var(--text); }
.us-ticker { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.us-badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.badge-a { background: rgba(29, 158, 117, 0.15); color: #10b981; }
.badge-b { background: rgba(24, 95, 165, 0.15); color: #3b82f6; }
.badge-c { background: rgba(186, 117, 23, 0.15); color: #f59e0b; }
.badge-d { background: rgba(163, 45, 45, 0.15); color: #ef4444; }

.us-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.us-metric {
  background: var(--bg-elevated);
  padding: 8px 10px;
  border-radius: 6px;
}
.us-metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.us-metric-value { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
.us-metric-value.up { color: #10b981; }
.us-metric-value.down { color: #ef4444; }

/* 盤後股價列 (data/us_prices.json,每個交易日自動更新) */
.us-quote { background: var(--bg-elevated); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.us-quote + .us-quote { margin-top: -6px; }
.us-quote-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.us-quote-sym { font-size: 12px; font-weight: 700; color: var(--text-dim); min-width: 44px; }
.us-quote-price { font-size: 20px; font-weight: 700; color: var(--text); }
.us-quote-chg { font-size: 14px; font-weight: 600; }
.us-quote-rets { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--text-dim); }
.us-quote-rets b { font-weight: 600; }
.us-quote-range { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.us-quote a { color: inherit; text-decoration: none; }
.us-quote a:hover .us-quote-sym { color: var(--accent); }
.q-up { color: #10b981; }
.q-down { color: #ef4444; }
.us-tape { margin-bottom: 20px; min-height: 46px; }
/* 淺色模式:加深綠、紅、各標籤字色,維持在淺底上的可讀性 (對比 ≥ 4.5) */
:root[data-theme="light"] .q-up, :root[data-theme="light"] .us-metric-value.up { color: #047857; }
:root[data-theme="light"] .q-down, :root[data-theme="light"] .us-metric-value.down { color: #dc2626; }
:root[data-theme="light"] .badge-a, :root[data-theme="light"] .badge-foundry { color: #047857; }
:root[data-theme="light"] .badge-b, :root[data-theme="light"] .badge-osat { color: #1d4ed8; }
:root[data-theme="light"] .badge-c, :root[data-theme="light"] .badge-memory { color: #b45309; }
:root[data-theme="light"] .badge-d { color: #b91c1c; }
:root[data-theme="light"] .badge-design { color: #5b4fd6; }
:root[data-theme="light"] .badge-component { color: #c2410c; }
:root[data-theme="light"] .badge-server { color: #475569; }

.us-news {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
  padding-top: 8px;
}
.us-news-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.us-news li { margin-bottom: 4px; }

.us-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 10px;
}
.us-tag {
  font-size: 10px;
  padding: 2px 8px;
  background: var(--bg-elevated);
  color: var(--text-dim);
  border-radius: 10px;
}

.us-updated {
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  margin-top: 8px;
  font-style: italic;
}

.us-no-data {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 20px;
  background: var(--bg-card);
  border: 1px dashed var(--border);
  border-radius: 12px;
  color: var(--text-dim);
  font-size: 14px;
}
</style>
</head>
<body>

<header class="hero">
  <div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切換主題">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
    <h1>半導體 + AI 供應鏈週報</h1>
    <nav>
      <a href="index.html">首頁</a>
      <a href="companies.html">公司</a>
      <a href="regions.html">區域</a>
      <a href="timeline.html">時間軸</a>
      <a href="briefs.html">快訊</a>
      <a href="supplychain.html">供應鏈</a>
      <a href="usstocks.html" class="active">美股追蹤</a>
      <a href="twstocks.html">台股追蹤</a>
      <a href="search.html">搜尋</a>
    </nav>
  </div>
</header>

<main class="container">

  <div class="us-hero">
    <h2>🇺🇸 美股 AI 供應鏈追蹤表</h2>
    <p>依 ROE 分級呈現 W22 週報核心美國公司,含最新股價動態、財報重點與供應鏈定位。<span id="price-asof"></span><span id="stocks-asof"></span></p>
  </div>

  <!-- TradingView 官方跑馬燈報價小工具 (即時走勢;點選可開啟 TradingView) -->
  <div class="us-tape" id="tv-tape"></div>

  <div class="us-filter">
    <button class="us-filter-btn active" data-filter="all" id="btn-all">全部</button>
    <button class="us-filter-btn" data-filter="a">🏆 A 級 龍頭</button>
    <button class="us-filter-btn" data-filter="b">🥈 B 級 挑戰者</button>
    <button class="us-filter-btn" data-filter="c">🥉 C 級 穩健</button>
    <button class="us-filter-btn" data-filter="d">📉 D 級 修復中</button>
    <button class="us-filter-btn" data-filter="chip">晶片設計</button>
    <button class="us-filter-btn" data-filter="server">系統廠</button>
    <button class="us-filter-btn" data-filter="equipment">設備 · 記憶體</button>
  </div>

  <div class="us-grid" id="us-grid"></div>

  <div style="margin-top: 32px; padding: 16px 20px; background: var(--bg-card); border-left: 3px solid var(--accent-warm); border-radius: 8px; color: var(--text-dim); font-size: 13px; line-height: 1.7;">
    <strong>⚠️ 提醒</strong>:所有股價與財報數字為新聞公開資料,僅供產業分析參考,非投資建議。實際交易請以券商即時報價與公司正式公告為準。
  </div>

</main>

<footer>
  <div class="container">
    <p>每週一(週報) · 週三五(快訊)自動更新 · GitHub Pages 部署</p>
  </div>
</footer>

<script>
// 公司卡片資料 (財報指標、近期重點、標籤):data/us_stocks.json,每週一隨週報由 Claude 依新聞更新
let STOCKS = [];
let STOCKS_UPDATED = "";

// 安全防護：對 HTML 特殊字元進行轉義
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ── 盤後股價 (data/us_prices.json,GitHub Actions 每個交易日收盤後由 Finnhub 抓取) ──
let PRICES = null;
const STALE_METRICS = ["股價", "YTD"];  // 有自動股價時,隱藏手寫且已過時的欄位
const SYMBOL_ALIAS = { GOOG: "GOOGL" };
const TV_SYMBOLS = {
  NVDA: "NASDAQ:NVDA", AVGO: "NASDAQ:AVGO", AMD: "NASDAQ:AMD", SMCI: "NASDAQ:SMCI",
  INTC: "NASDAQ:INTC", AMAT: "NASDAQ:AMAT", MU: "NASDAQ:MU", AMKR: "NASDAQ:AMKR",
  DELL: "NYSE:DELL", HPE: "NYSE:HPE", AAPL: "NASDAQ:AAPL", GOOGL: "NASDAQ:GOOGL",
  META: "NASDAQ:META", LRCX: "NASDAQ:LRCX", MRVL: "NASDAQ:MRVL", TSLA: "NASDAQ:TSLA"
};

const cardSymbols = s => s.ticker.split("/").map(t => SYMBOL_ALIAS[t.trim()] || t.trim());
const hasQuotes = s => !!PRICES && cardSymbols(s).some(t => PRICES.stocks[t]);
const fmtPct = v => v == null ? "–" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
const pctClass = v => v == null || v === 0 ? "" : (v > 0 ? "q-up" : "q-down");

function renderQuote(sym) {
  const q = PRICES && PRICES.stocks[sym];
  if (!q) return "";
  const ret = (label, v) => `<span>${label} <b class="${pctClass(v)}">${fmtPct(v)}</b></span>`;
  const tvUrl = `https://www.tradingview.com/symbols/${(TV_SYMBOLS[sym] || sym).replace(":", "-")}/`;
  return `
    <div class="us-quote">
      <div class="us-quote-main">
        <a href="${tvUrl}" target="_blank" rel="noopener noreferrer" title="在 TradingView 開啟 ${escapeHtml(sym)}"><span class="us-quote-sym">${escapeHtml(sym)} ↗</span></a>
        <span class="us-quote-price">$${q.price.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
        <span class="us-quote-chg ${pctClass(q.change_pct)}">${q.change != null ? (q.change > 0 ? "+" : "") + q.change.toFixed(2) : ""} (${fmtPct(q.change_pct)})</span>
      </div>
      <div class="us-quote-rets">${ret("5日", q.ret_5d)}${ret("本月", q.ret_mtd)}${ret("13週", q.ret_13w)}${ret("今年", q.ret_ytd)}</div>
      ${q.low_52w != null && q.high_52w != null ? `<div class="us-quote-range">52 週區間 $${q.low_52w} – $${q.high_52w}${q.stale ? " · ⚠️ 本次未更新" : ""}</div>` : ""}
    </div>`;
}

async function loadStocks() {
  const res = await fetch("data/us_stocks.json", { cache: "no-store" });
  const data = await res.json();
  STOCKS = data.stocks || [];
  STOCKS_UPDATED = data.updated_at || "";
  document.getElementById("stocks-asof").innerHTML =
    `財報指標與近期重點更新至 <strong>${escapeHtml(STOCKS_UPDATED)}</strong>。`;
}

async function loadPrices() {
  try {
    const res = await fetch("data/us_prices.json", { cache: "no-store" });
    if (!res.ok) return;
    PRICES = await res.json();
    document.getElementById("price-asof").innerHTML =
      `股價為 <strong>${escapeHtml(PRICES.as_of)}</strong> 美股收盤 (資料來源:${escapeHtml(PRICES.source)})。`;
  } catch (e) {
    PRICES = null;  // 沒有股價檔時維持原本的手寫內容
  }
}

function loadTradingViewTape() {
  const theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  const box = document.getElementById("tv-tape");
  box.innerHTML = '<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
  script.async = true;
  script.innerHTML = JSON.stringify({
    symbols: STOCKS.flatMap(cardSymbols).map(t => ({ proName: TV_SYMBOLS[t] || t, title: t })),
    showSymbolLogo: true, isTransparent: true, displayMode: "adaptive",
    colorTheme: theme, locale: "zh_TW"
  });
  box.firstChild.appendChild(script);
}

function renderStocks(filter) {
  const grid = document.getElementById('us-grid');
  
  const filtered = STOCKS.filter(s => {
    if (filter === 'all') return true;
    if (['a','b','c','d'].includes(filter)) return s.level === filter;
    return s.category === filter;
  });

  // 如果過濾結果為空，顯示提示訊息
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="us-no-data">🔍 暫無符合條件的股票資料</div>`;
    return;
  }

  grid.innerHTML = filtered.map(s => `
    <div class="us-card">
      <div class="us-card-header">
        <div>
          <div class="us-name">${escapeHtml(s.name)}</div>
          <div class="us-ticker">${escapeHtml(s.ticker)}</div>
        </div>
        <span class="us-badge badge-${escapeHtml(s.level)}">${escapeHtml(s.level.toUpperCase())} 級</span>
      </div>
      ${cardSymbols(s).map(renderQuote).join('')}
      <div class="us-metrics">
        ${Object.entries(s.metrics).filter(([k]) => !(hasQuotes(s) && STALE_METRICS.includes(k))).map(([k, v]) => {
          // 修正正負號顏色判斷：僅匹配第一個字元為 + 或 -（避免把 15-17% 的連字符誤判為跌）
          let statusClass = '';
          if (v.startsWith('+')) statusClass = 'up';
          else if (v.startsWith('-')) statusClass = 'down';

          return `
            <div class="us-metric">
              <div class="us-metric-label">${escapeHtml(k)}</div>
              <div class="us-metric-value ${statusClass}">${escapeHtml(v)}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="us-news">
        <div class="us-news-title">📰 近期重點</div>
        <ul style="margin: 0; padding-left: 18px;">
          ${s.news.map(n => `<li>${escapeHtml(n)}</li>`).join('')}
        </ul>
        <div class="us-tags">
          ${s.tags.map(t => `<span class="us-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
      <div class="us-updated">${hasQuotes(s) ? `股價:${escapeHtml(PRICES.as_of)} 收盤 · ` : ''}重點更新於 ${escapeHtml(s.updated_on || STOCKS_UPDATED)}</div>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    await loadStocks();
  } catch (e) {
    document.getElementById('us-grid').innerHTML = `<div class="us-no-data">無法載入公司資料 (data/us_stocks.json)</div>`;
    return;
  }

  // 切換深淺色主題時,重新載入 TradingView 小工具以套用配色
  const themeBtn = document.querySelector('.theme-toggle');
  if (themeBtn) themeBtn.addEventListener('click', () => setTimeout(loadTradingViewTape, 0));

  // 動態顯示全部資料的數量
  const btnAll = document.getElementById('btn-all');
  if (btnAll) {
    btnAll.textContent = `全部 (${STOCKS.length})`;
  }

  const buttons = document.querySelectorAll('.us-filter-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const filter = btn.dataset.filter;

      // 切換按鈕高亮狀態
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 渲染對應卡片
      renderStocks(filter);
    });
  });

  // 預設渲染全部 (先載入盤後股價)
  loadTradingViewTape();
  loadPrices().finally(() => renderStocks('all'));
});
</script>
</body>
</html>
