name: Semi Weekly and Briefs

# 排程皆為 UTC:週日 22:00 = 台灣週一 06:00 (週報);週二/四 22:00 = 台灣週三/五 06:00 (快訊)
#              週一~五 22:30 = 美股收盤後 (台灣週二~六 06:30,美股報價)
#              週一~五 06:00 = 台灣週一~五 14:00 (台股報價);08:00 = 16:00 補抓尚未公布的個股
#              每日 06:30 = 台灣每日 14:30 (新聞資料庫;台股重點由本機 Claude 排程 15:00 整理)
#              國定假日等非交易日:抓價程式偵測到交易日未更新即略過,不 commit、不部署
#              週一 12:00 = 台灣週一 20:00 (自動 Merge 查核通過的週報 PR 並部署)
#              每日 23:30 = 台灣每日 07:30 (影音觀點:整理財經節目 YouTube 影片)
on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 12 * * 1'
    - cron: '0 22 * * 0'
    - cron: '0 22 * * 2,4'
    - cron: '30 22 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '30 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (auto = 依台灣時間星期幾判斷)'
        type: choice
        options: [auto, weekly, brief, prices, twprices, news, twcards, automerge, videos]
        default: auto

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: semi-weekly-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  detect:
    runs-on: ubuntu-latest
    # 機器人自己推的 commit 不重跑 (GITHUB_TOKEN 推送本來就不會觸發,此為保險)
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="publish"
          elif [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ]; then
            MODE="prices"
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            MODE="videos"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 1" ]; then
            MODE="automerge"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then
            MODE="twprices"   # 14:00 收盤價;16:00 補抓尚未公布的個股
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            MODE="news"   # 每日抓新聞存入資料庫,供本機排程 15:00 整理台股重點
          elif [ "${{ github.event.schedule }}" = "0 22 * * 0" ]; then
            MODE="weekly"
          elif [ "$(date +%u)" = "1" ]; then
            MODE="weekly"
          else
            MODE="brief"
          fi
          echo "台灣時間 $(date '+%F %a %T') → mode=$MODE"
          echo "mode=$MODE" >> $GITHUB_OUTPUT

  # ── 週三、五:快訊,直接發佈 ──────────────────────────────
  brief:
    needs: detect
    if: needs.detect.outputs.mode == 'brief'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser pyyaml requests
      - run: python scripts/fetch_news.py
      - run: python scripts/archive_news.py
      - run: python scripts/generate_news_brief.py
      - run: python scripts/build_index.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ posts/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "快訊 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── 週一:Claude 產生週報 + 供應鏈圖,開 PR 等人工 Merge ──────
  weekly:
    needs: detect
    if: needs.detect.outputs.mode == 'weekly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser pyyaml requests anthropic
      - run: python scripts/fetch_news.py
      - run: python scripts/archive_news.py
      # 新聞資料庫直接存到 main,不放進 PR,確保週報沒 merge 也不會遺失新聞
      - name: Commit news archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.json data/news_archive.csv
          if ! git diff --staged --quiet; then
            git commit -m "新聞資料庫 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi
      - name: Generate weekly report and supply chain graph
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_draft.py
      # 備援:保留可手動貼到 Claude 的提示包
      - run: python scripts/prepare_prompt.py
      # 自動查核:格式、連結、事實查核;全部通過才標記 auto-merge-ok (週一 20:00 自動 Merge)
      - name: Verify weekly report
        id: verify
        if: steps.draft.outputs.week_tag != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/verify_weekly.py "${{ steps.draft.outputs.week_tag }}" || {
            echo "查核程式失敗,改為人工審閱"
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "### ⚠️ 自動查核程式執行失敗" > pr_body.md
            echo "請查看 Actions 紀錄,並人工審閱後再 Merge。" >> pr_body.md
          }
      - name: Create pull request
        if: steps.draft.outputs.week_tag != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: weekly/${{ steps.draft.outputs.week_tag }}
          # 只放內容檔;db.json / supplychain-index.json 等索引在 merge 後重建,避免與快訊衝突
          add-paths: |
            posts/${{ steps.draft.outputs.week_tag }}-semi-weekly.md
            data/supplychain-${{ steps.draft.outputs.week_tag }}.json
            data/us_stocks.json
          commit-message: "週報 ${{ steps.draft.outputs.week_tag }} (AI 草稿)"
          title: "📝 ${{ steps.draft.outputs.week_tag }} 週報:${{ steps.draft.outputs.title }}"
          body-path: pr_body.md
          labels: |
            weekly-report
            ${{ steps.verify.outputs.passed == 'true' && 'auto-merge-ok' || 'needs-review' }}
          delete-branch: true

  # ── 週一 20:00 (台灣):自動 Merge 查核通過、且未被保留的週報 PR,並重建索引 ──
  automerge:
    needs: detect
    if: needs.detect.outputs.mode == 'automerge'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Merge approved weekly PRs
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 條件:標有 weekly-report 與 auto-merge-ok;非草稿;沒有 needs-review 或 hold 標籤
          prs=$(gh pr list --state open --label weekly-report --label auto-merge-ok --json number,isDraft,labels -q '.[] | select(.isDraft | not) | select(any(.labels[]; .name == "needs-review" or .name == "hold") | not) | .number')
          if [ -z "$prs" ]; then echo "沒有可自動 Merge 的週報 PR"; exit 0; fi
          for n in $prs; do
            echo "Merge PR #$n"
            gh pr merge "$n" --merge --delete-branch && echo "merged=true" >> $GITHUB_OUTPUT
          done
      # GITHUB_TOKEN 的 merge 不會觸發 push 事件,在此直接重建索引
      - name: Rebuild index
        if: steps.merge.outputs.merged == 'true'
        run: |
          git pull origin main
          python scripts/build_index.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "重建索引 (自動 Merge 週報)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── 美股收盤後:抓取美股追蹤公司的收盤價與漲跌,直接發佈 ───────────
  prices:
    needs: detect
    if: needs.detect.outputs.mode == 'prices'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch US stock prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_us_prices.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_prices.json
          if ! git diff --staged --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "美股報價 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── 台股收盤後 (14:00,16:00 補抓):抓取台股追蹤公司的收盤價 (證交所、櫃買中心),直接發佈 ──
  twprices:
    needs: detect
    if: needs.detect.outputs.mode == 'twprices'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Taiwan stock prices
        run: python scripts/fetch_tw_prices.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tw_prices.json
          if ! git diff --staged --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "台股報價 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── 每日 14:30 (news):抓新聞存入資料庫;台股重點由本機 Claude 排程 15:00 整理 (不使用 API) ──
  # ── 手動 twcards:改用 Claude API 在雲端更新台股卡片 (備用) ──
  twcards:
    needs: detect
    if: needs.detect.outputs.mode == 'twcards' || needs.detect.outputs.mode == 'news'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser pyyaml requests anthropic
      - run: python scripts/fetch_news.py
      - run: python scripts/archive_news.py
      - name: Update Taiwan stock cards
        if: needs.detect.outputs.mode == 'twcards'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_tw_cards.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.json data/news_archive.csv data/tw_stocks.json
          if ! git diff --staged --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "${{ needs.detect.outputs.mode == 'twcards' && '台股重點' || '新聞資料庫' }} $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── 每日:整理財經節目 YouTube 影片 (有 YOUTUBE_API_KEY 用官方 API,否則用頻道 RSS) ──
  videos:
    needs: detect
    if: needs.detect.outputs.mode == 'videos'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser
      - name: Fetch YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py --days 14
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json data/tw_company_names.json
          if ! git diff --staged --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "影音觀點 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── PR merge (或任何推到 main) 後:重建索引 ───────────────────
  publish:
    needs: detect
    if: needs.detect.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python scripts/build_index.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "重建索引"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  deploy:
    needs: [detect, brief, publish, prices, twprices, twcards, automerge, videos]
    if: >-
      always() &&
      (needs.brief.result == 'success' || needs.publish.result == 'success' ||
       needs.prices.outputs.changed == 'true' || needs.twprices.outputs.changed == 'true' ||
       needs.twcards.outputs.changed == 'true' ||
       needs.automerge.outputs.merged == 'true' || needs.videos.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
