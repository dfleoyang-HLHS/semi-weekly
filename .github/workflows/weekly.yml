name: Semi Weekly and Briefs

# 排程皆為 UTC:週日 22:00 = 台灣週一 06:00 (週報);週二/四 22:00 = 台灣週三/五 06:00 (快訊)
#              週一~五 22:30 = 美股收盤後 (台灣週二~六 06:30,美股報價)
on:
  schedule:
    - cron: '0 22 * * 0'
    - cron: '0 22 * * 2,4'
    - cron: '30 22 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (auto = 依台灣時間星期幾判斷)'
        type: choice
        options: [auto, weekly, brief, prices]
        default: auto

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: semi-weekly-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  detect:
    runs-on: ubuntu-latest
    # 機器人自己推的 commit 不重跑 (GITHUB_TOKEN 推送本來就不會觸發,此為保險)
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="publish"
          elif [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ]; then
            MODE="prices"
          elif [ "${{ github.event.schedule }}" = "0 22 * * 0" ]; then
            MODE="weekly"
          elif [ "$(date +%u)" = "1" ]; then
            MODE="weekly"
          else
            MODE="brief"
          fi
          echo "台灣時間 $(date '+%F %a %T') → mode=$MODE"
          echo "mode=$MODE" >> $GITHUB_OUTPUT

  # ── 週三、五:快訊,直接發佈 ──────────────────────────────
  brief:
    needs: detect
    if: needs.detect.outputs.mode == 'brief'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser pyyaml requests
      - run: python scripts/fetch_news.py
      - run: python scripts/archive_news.py
      - run: python scripts/generate_news_brief.py
      - run: python scripts/build_index.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ posts/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "快訊 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── 週一:Claude 產生週報 + 供應鏈圖,開 PR 等人工 Merge ──────
  weekly:
    needs: detect
    if: needs.detect.outputs.mode == 'weekly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser pyyaml requests anthropic
      - run: python scripts/fetch_news.py
      - run: python scripts/archive_news.py
      # 新聞資料庫直接存到 main,不放進 PR,確保週報沒 merge 也不會遺失新聞
      - name: Commit news archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.json data/news_archive.csv
          if ! git diff --staged --quiet; then
            git commit -m "新聞資料庫 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi
      - name: Generate weekly report and supply chain graph
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_draft.py
      # 備援:保留可手動貼到 Claude 的提示包
      - run: python scripts/prepare_prompt.py
      - name: Create pull request
        if: steps.draft.outputs.week_tag != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: weekly/${{ steps.draft.outputs.week_tag }}
          # 只放內容檔;db.json / supplychain-index.json 等索引在 merge 後由 publish 重建,避免與快訊衝突
          add-paths: |
            posts/${{ steps.draft.outputs.week_tag }}-semi-weekly.md
            data/supplychain-${{ steps.draft.outputs.week_tag }}.json
            data/us_stocks.json
          commit-message: "週報 ${{ steps.draft.outputs.week_tag }} (AI 草稿)"
          title: "📝 ${{ steps.draft.outputs.week_tag }} 週報待審:${{ steps.draft.outputs.title }}"
          body: |
            Claude 已自動產生本週週報與供應鏈圖,請審閱後 **Merge** 即會自動發佈到網站。

            - 週報:`posts/${{ steps.draft.outputs.week_tag }}-semi-weekly.md`
            - 供應鏈圖:`data/supplychain-${{ steps.draft.outputs.week_tag }}.json`
            - 美股追蹤卡片 (財報指標、近期重點):`data/us_stocks.json` (本週無更新則不會出現在變更中)

            審閱重點:
            - [ ] 數字與事實是否正確 (對照文末參考來源)
            - [ ] 供應鏈圖新增/刪除的公司與關係是否合理
            - [ ] 美股卡片的財報數字是否與新聞一致
            - [ ] 需要修改可直接在 PR 的 Files changed 頁面編輯 (… → Edit file)

            不要發佈就直接 Close 這個 PR。
          labels: weekly-report
          delete-branch: true

  # ── 美股收盤後:抓取美股追蹤公司的收盤價與漲跌,直接發佈 ───────────
  prices:
    needs: detect
    if: needs.detect.outputs.mode == 'prices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch US stock prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_us_prices.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_prices.json
          if ! git diff --staged --quiet; then
            git commit -m "美股報價 $(date +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  # ── PR merge (或任何推到 main) 後:重建索引 ───────────────────
  publish:
    needs: detect
    if: needs.detect.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python scripts/build_index.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "重建索引"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push retry $i/5"; sleep 5
            done
          fi

  deploy:
    needs: [detect, brief, publish, prices]
    if: >-
      always() &&
      (needs.brief.result == 'success' || needs.publish.result == 'success' || needs.prices.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
