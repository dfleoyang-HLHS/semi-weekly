<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股 AI 供應鏈追蹤 - 半導體週報</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<style>
.us-hero {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
}
.us-hero h2 { color: var(--accent); margin-bottom: 8px; font-size: 20px; }
.us-hero p { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin: 0; }

.us-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.us-filter-btn {
  padding: 6px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.us-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.us-filter-btn.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

.us-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.us-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.us-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.us-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.us-name { font-size: 18px; font-weight: 700; color: var(--text); }
.us-ticker { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.us-badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.badge-a { background: rgba(29, 158, 117, 0.15); color: #10b981; }
.badge-b { background: rgba(24, 95, 165, 0.15); color: #3b82f6; }
.badge-c { background: rgba(186, 117, 23, 0.15); color: #f59e0b; }
.badge-d { background: rgba(163, 45, 45, 0.15); color: #ef4444; }
.badge-foundry   { background: rgba(29, 158, 117, 0.15); color: #10b981; }
.badge-osat      { background: rgba(24, 95, 165, 0.15); color: #3b82f6; }
.badge-design    { background: rgba(127, 119, 221, 0.18); color: #8b80f0; }
.badge-memory    { background: rgba(186, 117, 23, 0.15); color: #f59e0b; }
.badge-component { background: rgba(216, 90, 48, 0.15); color: #f97316; }
.badge-server    { background: rgba(100, 116, 139, 0.18); color: #94a3b8; }

.us-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.us-metric {
  background: var(--bg-elevated);
  padding: 8px 10px;
  border-radius: 6px;
}
.us-metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.us-metric-value { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
/* 台股習慣:漲紅、跌綠 */
.us-metric-value.up { color: #ef4444; }
.us-metric-value.down { color: #10b981; }

/* 盤後股價列 (data/us_prices.json,每個交易日自動更新) */
.us-quote { background: var(--bg-elevated); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.us-quote + .us-quote { margin-top: -6px; }
.us-quote-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.us-quote-sym { font-size: 12px; font-weight: 700; color: var(--text-dim); min-width: 44px; }
.us-quote-price { font-size: 20px; font-weight: 700; color: var(--text); }
.us-quote-chg { font-size: 14px; font-weight: 600; }
.us-quote-rets { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--text-dim); }
.us-quote-rets b { font-weight: 600; }
.us-quote-range { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.us-quote a { color: inherit; text-decoration: none; }
.us-quote a:hover .us-quote-sym { color: var(--accent); }
.q-up { color: #ef4444; }
.q-down { color: #10b981; }
.us-tape { margin-bottom: 20px; min-height: 46px; }
/* 台股跑馬燈:TradingView 小工具不提供證交所上市股報價,改用官方收盤資料自行呈現 */
.tw-tape { overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
.tw-tape-track { display: inline-flex; white-space: nowrap; animation: tw-scroll 60s linear infinite; }
.tw-tape:hover .tw-tape-track { animation-play-state: paused; }
.tw-tape a { display: inline-flex; align-items: baseline; gap: 6px; padding: 12px 18px; border-right: 1px solid var(--border);
  color: var(--text); text-decoration: none; font-size: 14px; }
.tw-tape a:hover .tw-tape-name { color: var(--accent); }
.tw-tape-name { font-weight: 700; }
.tw-tape-code { font-size: 11px; color: var(--text-dim); }
.tw-tape-src { font-size: 11px; color: var(--text-dim); text-align: right; margin: 4px 2px 0; }
@keyframes tw-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tw-tape { overflow-x: auto; } .tw-tape-track { animation: none; } }

.us-news {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
  padding-top: 8px;
}
.us-news-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.us-news li { margin-bottom: 4px; }

.us-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 10px;
}
.us-tag {
  font-size: 10px;
  padding: 2px 8px;
  background: var(--bg-elevated);
  color: var(--text-dim);
  border-radius: 10px;
}

.us-updated {
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  margin-top: 8px;
  font-style: italic;
}

.us-no-data {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 20px;
  background: var(--bg-card);
  border: 1px dashed var(--border);
  border-radius: 12px;
  color: var(--text-dim);
  font-size: 14px;
}
</style>
</head>
<body>

<header class="hero">
  <div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切換主題">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
    <h1>半導體 + AI 供應鏈週報</h1>
    <nav>
      <a href="index.html">首頁</a>
      <a href="companies.html">公司</a>
      <a href="regions.html">區域</a>
      <a href="timeline.html">時間軸</a>
      <a href="briefs.html">快訊</a>
      <a href="supplychain.html">供應鏈</a>
      <a href="usstocks.html">美股追蹤</a>
      <a href="twstocks.html" class="active">台股追蹤</a>
      <a href="search.html">搜尋</a>
    </nav>
  </div>
</header>

<main class="container">

  <div class="us-hero">
    <h2>🇹🇼 台股 AI 供應鏈追蹤表</h2>
    <p>以週報與新聞中出現的關鍵台灣公司為主,依供應鏈位置分類,含每日收盤行情、營運重點與新聞動態 (漲紅跌綠)。<span id="price-asof"></span><span id="stocks-asof"></span></p>
  </div>

  <!-- 台股跑馬燈:證交所、櫃買中心收盤資料;點選以股票代號開啟 TradingView 個股頁 -->
  <div class="us-tape" id="tv-tape"></div>

  <div class="us-filter">
    <button class="us-filter-btn active" data-filter="all" id="btn-all">全部</button>
    <button class="us-filter-btn" data-filter="foundry">晶圓代工</button>
    <button class="us-filter-btn" data-filter="osat">封測</button>
    <button class="us-filter-btn" data-filter="design">IC 設計</button>
    <button class="us-filter-btn" data-filter="memory">記憶體</button>
    <button class="us-filter-btn" data-filter="component">載板 · 零組件</button>
    <button class="us-filter-btn" data-filter="server">伺服器 · 代工</button>
  </div>

  <div class="us-grid" id="us-grid"></div>

  <div style="margin-top: 32px; padding: 16px 20px; background: var(--bg-card); border-left: 3px solid var(--accent-warm); border-radius: 8px; color: var(--text-dim); font-size: 13px; line-height: 1.7;">
    <strong>⚠️ 提醒</strong>:股價來自臺灣證券交易所、證券櫃檯買賣中心公開資料 (報酬率與 52 週區間已還原除權 / 分割,現金除息未還原),營運數字取自新聞,僅供產業分析參考,非投資建議。實際交易請以券商即時報價與公司正式公告為準。
  </div>

</main>

<footer>
  <div class="container">
    <p>每週一(週報) · 週三五(快訊)自動更新 · GitHub Pages 部署</p>
  </div>
</footer>

<script>
// 公司卡片資料 (營運指標、近期重點、標籤):data/tw_stocks.json,每週一隨週報由 Claude 依新聞更新
let STOCKS = [];
let STOCKS_UPDATED = "";

// 安全防護：對 HTML 特殊字元進行轉義
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ── 盤後股價 (data/tw_prices.json,GitHub Actions 每個交易日收盤後由證交所、櫃買中心開放資料抓取) ──
let PRICES = null;
const STALE_METRICS = [];
const CATEGORY_NAME = { foundry: "晶圓代工", osat: "封測", design: "IC 設計", memory: "記憶體", component: "載板 · 零組件", server: "伺服器 · 代工" };
// TradingView 代號:上市 TWSE:代號、上櫃 TPEX:代號
const tvSymbol = code => {
  const s = STOCKS.find(x => x.ticker === code);
  return `${s && s.market === "上櫃" ? "TPEX" : "TWSE"}:${code}`;
};

const cardSymbols = s => [s.ticker];
const hasQuotes = s => !!PRICES && cardSymbols(s).some(t => PRICES.stocks[t]);
const fmtPct = v => v == null ? "–" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
const pctClass = v => v == null || v === 0 ? "" : (v > 0 ? "q-up" : "q-down");

function renderQuote(sym) {
  const q = PRICES && PRICES.stocks[sym];
  if (!q) return "";
  const ret = (label, v) => `<span>${label} <b class="${pctClass(v)}">${fmtPct(v)}</b></span>`;
  const tvUrl = `https://www.tradingview.com/symbols/${tvSymbol(sym).replace(":", "-")}/`;
  return `
    <div class="us-quote">
      <div class="us-quote-main">
        <a href="${tvUrl}" target="_blank" rel="noopener noreferrer" title="在 TradingView 開啟 ${escapeHtml(sym)}"><span class="us-quote-sym">${escapeHtml(sym)} ↗</span></a>
        <span class="us-quote-price">NT$${q.price.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
        <span class="us-quote-chg ${pctClass(q.change_pct)}">${q.change != null ? (q.change > 0 ? "+" : "") + q.change.toFixed(2) : ""} (${fmtPct(q.change_pct)})</span>
      </div>
      <div class="us-quote-rets">${ret("5日", q.ret_5d)}${ret("本月", q.ret_mtd)}${ret("13週", q.ret_13w)}${ret("今年", q.ret_ytd)}</div>
      ${q.low_52w != null && q.high_52w != null ? `<div class="us-quote-range">52 週區間 NT$${q.low_52w.toLocaleString("en-US")} – NT$${q.high_52w.toLocaleString("en-US")}${q.adjusted ? ` · 已還原除權/分割 (${escapeHtml(q.adjusted.map(a => a.split(" ")[0]).join("、"))})` : ""}${q.stale ? " · ⚠️ 本次未更新" : ""}</div>` : ""}
    </div>`;
}

async function loadStocks() {
  const res = await fetch("data/tw_stocks.json", { cache: "no-store" });
  const data = await res.json();
  STOCKS = data.stocks || [];
  STOCKS_UPDATED = data.updated_at || "";
  document.getElementById("stocks-asof").innerHTML =
    `營運指標與近期重點更新至 <strong>${escapeHtml(STOCKS_UPDATED)}</strong>。`;
}

async function loadPrices() {
  try {
    const res = await fetch("data/tw_prices.json", { cache: "no-store" });
    if (!res.ok) return;
    PRICES = await res.json();
    document.getElementById("price-asof").innerHTML =
      `股價為 <strong>${escapeHtml(PRICES.as_of)}</strong> 台股收盤 (資料來源:${escapeHtml(PRICES.source)})。`;
  } catch (e) {
    PRICES = null;  // 沒有股價檔時維持原本的手寫內容
  }
}

function loadTradingViewTape() {
  // TradingView 免費小工具沒有證交所上市股的報價授權 (TWSE:代號 會顯示無資料),
  // 因此用 data/tw_prices.json 的官方收盤價自行產生跑馬燈,每檔以代號連到 TradingView 個股頁
  const box = document.getElementById("tv-tape");
  if (!PRICES) { box.innerHTML = ""; return; }
  const items = STOCKS.filter(s => PRICES.stocks[s.ticker]).map(s => {
    const q = PRICES.stocks[s.ticker];
    const url = `https://www.tradingview.com/symbols/${tvSymbol(s.ticker).replace(":", "-")}/`;
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" title="在 TradingView 開啟 ${escapeHtml(tvSymbol(s.ticker))}">
      <span class="tw-tape-name">${escapeHtml(s.name)}</span><span class="tw-tape-code">${escapeHtml(s.ticker)}</span>
      <span>${q.price.toLocaleString("en-US", { maximumFractionDigits: 2 })}</span>
      <span class="${pctClass(q.change_pct)}">${fmtPct(q.change_pct)}</span></a>`;
  }).join("");
  // 內容重複一次,捲動到一半時無縫接回開頭
  box.innerHTML = `<div class="tw-tape"><div class="tw-tape-track">${items}${items}</div></div>
    <div class="tw-tape-src">${escapeHtml(PRICES.as_of)} 收盤 · 資料來源:${escapeHtml(PRICES.source)}</div>`;
}

function renderStocks(filter) {
  const grid = document.getElementById('us-grid');
  
  const filtered = STOCKS.filter(s => {
    if (filter === 'all') return true;
    return s.category === filter;
  });

  // 如果過濾結果為空，顯示提示訊息
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="us-no-data">🔍 暫無符合條件的股票資料</div>`;
    return;
  }

  grid.innerHTML = filtered.map(s => `
    <div class="us-card">
      <div class="us-card-header">
        <div>
          <div class="us-name">${escapeHtml(s.name)}</div>
          <div class="us-ticker">${escapeHtml(s.ticker)} · ${escapeHtml(s.market)}</div>
        </div>
        <span class="us-badge badge-${escapeHtml(s.category)}">${escapeHtml(CATEGORY_NAME[s.category] || s.category)}</span>
      </div>
      ${cardSymbols(s).map(renderQuote).join('')}
      <div class="us-metrics">
        ${Object.entries(s.metrics).filter(([k]) => !(hasQuotes(s) && STALE_METRICS.includes(k))).map(([k, v]) => {
          // 修正正負號顏色判斷：僅匹配第一個字元為 + 或 -（避免把 15-17% 的連字符誤判為跌）
          let statusClass = '';
          if (v.startsWith('+')) statusClass = 'up';
          else if (v.startsWith('-')) statusClass = 'down';

          return `
            <div class="us-metric">
              <div class="us-metric-label">${escapeHtml(k)}</div>
              <div class="us-metric-value ${statusClass}">${escapeHtml(v)}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="us-news">
        <div class="us-news-title">📰 近期重點</div>
        <ul style="margin: 0; padding-left: 18px;">
          ${s.news.map(n => `<li>${escapeHtml(n)}</li>`).join('')}
        </ul>
        <div class="us-tags">
          ${s.tags.map(t => `<span class="us-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
      <div class="us-updated">${hasQuotes(s) ? `股價:${escapeHtml(PRICES.as_of)} 收盤 · ` : ''}重點更新於 ${escapeHtml(s.updated_on || STOCKS_UPDATED)}</div>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    await loadStocks();
  } catch (e) {
    document.getElementById('us-grid').innerHTML = `<div class="us-no-data">無法載入公司資料 (data/tw_stocks.json)</div>`;
    return;
  }


  // 動態顯示全部資料的數量
  const btnAll = document.getElementById('btn-all');
  if (btnAll) {
    btnAll.textContent = `全部 (${STOCKS.length})`;
  }

  const buttons = document.querySelectorAll('.us-filter-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const filter = btn.dataset.filter;

      // 切換按鈕高亮狀態
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 渲染對應卡片
      renderStocks(filter);
    });
  });

  // 預設渲染全部 (先載入盤後股價,再產生跑馬燈)
  loadPrices().finally(() => { loadTradingViewTape(); renderStocks('all'); });
});
</script>
</body>
</html>
